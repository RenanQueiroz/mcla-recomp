# Frame timing hooks. Implemented in src/frame_timing.cpp.
#
# The addresses and the analysis of the engine timer (sub_821BDA90, timer
# object at 0x827D7500) come from LARecomp's TECHNICAL_NOTES.md, sections 1-3.
# The original 60 FPS timing pipeline there is credited to BadassBaboon.

# 0x821BDA90: the engine timer's first instruction (`mftb r11`), before it reads the time.
# Where a frame starts for the GPU vendor's latency reducer (NVIDIA Reflex, AMD Anti-Lag 2):
# its wait comes here, so that the time the timer then reads, and so the simulation step, is
# the one after the wait (src/frame_timing.cpp, mcla_frame_start). r3 is the timer object.
[[midasm_hook]]
name = "mcla_frame_start"
address = 0x821BDA90
registers = ["r3"]

# 0x821BDAB0: `subf r8,r10,r11`, elapsed guest ticks since the previous frame.
# Hooked after the instruction: clamps a runaway delta and runs the host frame
# limiter, so the wait is part of the frame the timer then measures.
[[midasm_hook]]
name = "mcla_frame_delta"
address = 0x821BDAB0
after_instruction = true
registers = ["r8"]

# 0x821BDB58: head of the first fixed-timestep block, which overwrites the
# measured delta with a fixed 33.3 ms. Jumping to loc_821BDC34 skips only that
# overwrite; the accumulated-time updates before it still run.
[[midasm_hook]]
name = "mcla_use_real_delta"
address = 0x821BDB58
jump_address_on_true = 0x821BDC34

# 0x821BDB90: the second fixed-timestep path, taken on every gameplay frame.
# Hooked after `lfs f11,0x20(r3)`; f11 is replaced with the measured unscaled
# delta at [r3+0x58] so this path publishes real time too.
[[midasm_hook]]
name = "mcla_fixed_step_path"
address = 0x821BDB90
after_instruction = true
registers = ["r3", "f11"]

# 0x82419AA0: `li r11,2`, the present interval (vblanks per present) written
# into the swap packet. Two means 30 Hz.
[[midasm_hook]]
name = "mcla_present_interval"
address = 0x82419AA0
registers = ["r11"]
jump_address_on_true = 0x82419AA4

# --- Corrections for code that assumes 33.3 ms frames -----------------------
# From LARecomp (credited there to BadassBaboon). Each replaces a per-frame
# smoothing factor with its continuous-time equivalent.

# 0x82320468: `addi r9,r1,0x50` in sub_82320298 (camBoomCS::Update, the
# gameplay chase camera). f13 is the position (velocity filter) factor, which
# the game itself halves when the frame rate is below 60.
[[midasm_hook]]
name = "mcla_camera_pos_smoothing"
address = 0x82320468
registers = ["f13"]

# 0x823204F4: `li r9,0x120` in the same function. f0 is the look-at
# (acceleration filter) factor, halved by the game in the same way.
[[midasm_hook]]
name = "mcla_camera_lookat_smoothing"
address = 0x823204F4
registers = ["f0"]

# 0x82563720: `lis r11,flt_82001D14@ha` in sub_82563298. f0 is the chassis
# ground-depth filter coefficient (0.10 per frame at 30 FPS). This is the
# chassis roll and ground filtering behaviour.
[[midasm_hook]]
name = "mcla_chassis_depth_smoothing"
address = 0x82563720
registers = ["f0"]

# 0x8236895C: `addi r8,r1,100` in sub_823688B8 (mcBikeGyro::Update, the
# motorcycle's lean; identified by LARecomp from the game's RTTI), where both
# ways through its frame-rate test meet. f13 is the smoothed-position factor:
# 0.40 from 0x827E6740, doubled by the game below 60 FPS.
[[midasm_hook]]
name = "mcla_bike_gyro_pos_smoothing"
address = 0x8236895C
registers = ["f13"]

# 0x823689F0: `addi r9,r1,100` in the same function, the same meeting point
# for the smoothed-velocity factor in f0: 0.15 from 0x827E6744, also doubled
# below 60 FPS.
[[midasm_hook]]
name = "mcla_bike_gyro_vel_smoothing"
address = 0x823689F0
registers = ["f0"]

# --- UI (Flash) movies -------------------------------------------------------
# From LARecomp's notes: mcUIManager::Update
# (sub_821FC588) steps every enabled UI movie with the Flash player's one-frame
# mode, which advances exactly one movie frame per call and ignores the elapsed
# time; the flag it passes (byte_827DC1FC) is 1 in the image and never written.

# 0x825EDC6C: `beq cr6,0x825EDC78` in sub_825EDC08, the movie advance, right
# after the length of one movie frame is computed and before the branch on the
# one-frame flag (r25). r31 is the movie's player context. Jumping to
# 0x825EDD44, the path taken when a movie is not yet due, holds the advance back.
# f30 is the elapsed time the caller passed and f31 the length of one movie frame (seconds); cr6 is the
# compare of r25 with 0 that the next instruction branches on. A movie with a rule in mcla_ui_movie_rates
# that is behind is turned into the elapsed-time call (r25 = 0, cr6 equal, the accumulator at [movie+24]
# set) so that it steps several frames in one update.
[[midasm_hook]]
name = "mcla_ui_movie_advance"
address = 0x825EDC6C
registers = ["r25", "r31", "f30", "f31", "cr6"]
jump_address_on_true = 0x825EDD44

# 0x822124DC: `addi r4,r8,-9924` in sub_82212298 (the HUD's big update, called every update with the update's elapsed
# time in f1 of its caller and f30 here), right after `fmr f1,f31`. r3 is the HUD gauge movie's swfCONTEXT (the HUD
# manager's movie 0, 0x8286E6E0) and f1 the value for the ActionScript variable `countdownUpdate`, which the next
# instructions set (`bl sub_825EE188`, name at 0x8201D93C): this update's elapsed time (0 or [timer+100] in two special
# cases). The movie's script adds the variable to the race-start countdown's clock on every movie step, so a movie that
# steps less often than the game updates (the pacing above) loses the time of the updates in between and the countdown
# runs slow. The hook gives the variable the time since the movie's last step (src/frame_timing.cpp, mcla_ui_countdown_fix).
[[midasm_hook]]
name = "mcla_ui_countdown_dt"
address = 0x822124DC
registers = ["r3", "f1"]

# --- Interpolated UI (development spike, mcla_ui_interpolate) ------------------------------
# sub_825FB348 is the draw walk over the display tree (swfINSTANCE nodes; r3 = the node, r4 = the parent's
# state block, whose world matrix is at +24 and world colour transform at +56): it computes the node's
# world matrix (0x825FB38C-0x825FB454) and then its world colour transform (`bl sub_825F8B20` at
# 0x825FB480) from the node's local ones, then draws the node or walks its children.
# 0x825FB484: `lhz r9,170(r30)`, right after both are computed. r30 = the node, r31 = the parent's state
# block. The hook redoes the node's world values from local values blended between the last two steps.
[[midasm_hook]]
name = "mcla_ui_interp_draw"
address = 0x825FB484
registers = ["r30", "r31"]

# --- Interpolated UI, the pause menu's 3D (mcla_ui_interp_camera) ---------------------------
# The camera and the 3D panels of the pause menu come from numbers its script sets in 30 Hz steps and the
# game reads again in every update and drawn frame; src/frame_timing.cpp (UiSceneBlend) blends the reads.
# sub_82722440 reads an array of three numbers from a script object (r30 = the object, r31 = where the
# numbers go; the property's name is the pointer saved at 96(r1)); sub_822222F0 reads one number the same
# way (name saved at 80(r1)). Both hooks sit on `li r3,1`, the success path, after the numbers are stored.
[[midasm_hook]]
name = "mcla_ui_scene_vec"
address = 0x82722524
registers = ["r1", "r30", "r31"]

[[midasm_hook]]
name = "mcla_ui_scene_float"
address = 0x82722374
registers = ["r1", "r30", "r31"]

# sub_82724CF0 draws a movie's 3D scene (r3 = its player context): the entry, and `b 0x823d9230` at its end,
# which every way out passes. Only reads inside them are the panels'.
[[midasm_hook]]
name = "mcla_ui_scene_enter"
address = 0x82724CF0
registers = ["r3"]

[[midasm_hook]]
name = "mcla_ui_scene_leave"
address = 0x82724E64
registers = ["r1"]

# sub_827238B0 is the advance of the UI movies' player context (vtable 0x820CACB8, slot +4): the movie's
# step, then `player0_cam_ctrl` (the blend between the game's view and the menu's) and, when it is not 0, the
# camera (sub_82723570). 0x827238F8 is `lfs f0,80(r1)`, f0 = that blend (r31 = the context); the hook, placed
# after the instruction, can replace it. 0x82723934 is `ld r31,-16(r1)`, where the function's every way out
# passes, with r31 still the context.
[[midasm_hook]]
name = "mcla_ui_cam_ctrl"
address = 0x827238F8
after_instruction = true
registers = ["r31", "f0"]

[[midasm_hook]]
name = "mcla_ui_cam_done"
address = 0x82723934
registers = ["r31"]

# --- Menu key repeat ----------------------------------------------------------
# sub_82223CD8 is the UI input object's update (once per UI manager update, called from
# sub_82224920): for each of the 24 menu inputs (r31 = 0..23; r4 = its key code, -1 for none) it
# sends a key down when the button is first seen pressed and, while it is held, again when a
# counter (byte array at r29) reaches a threshold (byte array at r28): 7 updates after the key
# down, then [object+803] = 6. Counted in updates, so it was 58 ms then 50 ms at 120 FPS.
# See src/frame_timing.cpp (mcla_ui_repeat_fix).

# 0x822240C0 (`stbx r27,r31,r28`): the branch of a button first seen pressed.
[[midasm_hook]]
name = "mcla_ui_key_press"
address = 0x822240C0
registers = ["r31", "r4"]

# 0x822241D0 (`cmplw cr6,r10,r8`): r8 = the count after this update (just stored), r10 = the
# threshold. Equal sends the repeat. The hook can make it not equal and put the count back.
[[midasm_hook]]
name = "mcla_ui_key_repeat"
address = 0x822241D0
registers = ["r10", "r8", "r29", "r31", "r4"]

# --- Intro movies ------------------------------------------------------------
# The start-up legal screens and logos are not paced by the engine timer; they
# are held to 30 per second in mcla_present_interval (see src/frame_timing.cpp).

# 0x822C2F08: jumping to 0x822C2F7C skips the intro sequence.
[[midasm_hook]]
name = "mcla_hook_skip_intro"
address = 0x822C2F08
jump_address_on_true = 0x822C2F7C

# 0x821315E4: `bl sub_822E5B00` in sub_82131508, reached with r4 = -1 when the
# legals screen object was never created (as after a skip). -1 sets bit 24 of
# the render pass mask, which enables a pass whose stage was never prepared and
# corrupts the frame. Every other caller passes 0xFEFFFFFF.
[[midasm_hook]]
name = "mcla_skip_intro_render_pass_mask"
address = 0x821315E4
registers = ["r4"]
