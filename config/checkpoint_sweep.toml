# Checkpoints and line triggers that a script asks about (src/checkpoint_sweep.cpp): the test is a segment
# from the racer's previous position (+400) to its position, and a script that looks only every 2nd to 4th
# update above 30 FPS never tests the road the other updates covered. The checkpoint test (sub_822653A8) is
# overridden in the source file; this is mcTriggerLine::Check (sub_826881A8), at the `beq` after the two
# vector stores (r1 + 128 = the segment's start, r1 + 144 = its end), r27 = the racer, r31 = the trigger.
# No option turns it off (a game-breaking fix).
[[midasm_hook]]
name = "mcla_trigger_line_sweep"
address = 0x82688200
registers = ["r1", "r31", "r27"]
